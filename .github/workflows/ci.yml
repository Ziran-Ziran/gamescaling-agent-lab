name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: python scripts/validate_project.py
      - run: python scripts/sync_engineering.py
      - run: python -m unittest discover -s tests -p "test_engineering*.py" -v
      - run: python -m unittest discover -s tests -p "test_repository_policy.py" -v
      - run: python -m unittest discover -s tests -p "test_local_scene.py" -v
      - run: git show --format= --check HEAD

  controller-offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/controller.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m unittest discover -s tests -v

  training-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==13.0.0 numpy==2.2.6
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p "test_training*.py" -v
      - run: python -m unittest discover -s tests -p test_resource_guard.py -v
      - run: python -m unittest discover -s tests -p test_audio_contract.py -v
      - run: python -m unittest discover -s tests -p test_latency_benchmark.py -v
